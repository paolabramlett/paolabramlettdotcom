<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t"><title id="t">Illustration of a clean genogram canvas mapping three generations of a family</title>
<defs>
<radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#1b2344"/><stop offset="1" stop-color="#080b18"/></radialGradient>
<pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity=".07"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#dots)"/>
<!-- toolbar -->
<rect x="80" y="72" width="360" height="64" rx="32" fill="#ffffff" opacity=".08" stroke="#fff" stroke-opacity=".14"/>
<g fill="#fff" opacity=".75"><rect x="112" y="92" width="24" height="24" rx="4" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="184" cy="104" r="12" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M226 104h36" stroke="#fff" stroke-width="2.5"/><path d="M290 104l8-10 8 20 8-20 8 20 8-10" fill="none" stroke="#fff" stroke-width="2.5"/></g>
<rect x="364" y="88" width="56" height="32" rx="16" fill="#a78bfa"/>
<g stroke="#e8e6f5" stroke-width="3" fill="none" stroke-linecap="round">
<!-- gen 1 -->
<path d="M560 250h200"/><path d="M660 250v90"/><path d="M500 340h500"/><path d="M500 340v70"/><path d="M1000 340v70"/>
<path d="M940 250h200"/><path d="M1040 250v40"/>
<!-- gen2 marriage -->
<path d="M520 450h160"/><path d="M1000 450h-180" />
<path d="M600 450v110"/><path d="M500 560h220"/><path d="M500 560v70"/><path d="M720 560v70"/>
</g>
<!-- close relationship triple line -->
<g stroke="#5eead4" stroke-width="3" opacity=".9"><path d="M1024 440 L1024 440"/></g>
<g stroke="#5eead4" stroke-width="2.5"><path d="M540 650h140"/><path d="M540 660h140"/><path d="M540 670h140"/></g>
<!-- conflict zigzag -->
<path d="M820 470 l18 22 18 -22 18 22 18 -22 18 22 18 -22 18 22 18 -22 18 22 18 -22" fill="none" stroke="#fb7185" stroke-width="3" transform="translate(-10,-20)"/>
<!-- nodes gen1 -->
<rect x="524" y="214" width="72" height="72" rx="6" fill="#131a33" stroke="#e8e6f5" stroke-width="3"/>
<circle cx="760" cy="250" r="36" fill="#131a33" stroke="#e8e6f5" stroke-width="3"/>
<rect x="904" y="214" width="72" height="72" rx="6" fill="#131a33" stroke="#e8e6f5" stroke-width="3" opacity=".6"/><path d="M904 214l72 72M976 214l-72 72" stroke="#e8e6f5" stroke-width="3" opacity=".6"/>
<circle cx="1140" cy="250" r="36" fill="#131a33" stroke="#e8e6f5" stroke-width="3"/>
<!-- gen2 -->
<rect x="464" y="414" width="72" height="72" rx="6" fill="#131a33" stroke="#e8e6f5" stroke-width="3"/>
<circle cx="680" cy="450" r="36" fill="#131a33" stroke="#e8e6f5" stroke-width="3"/>
<circle cx="1000" cy="450" r="36" fill="#131a33" stroke="#e8e6f5" stroke-width="3"/>
<rect x="1104" y="414" width="72" height="72" rx="6" fill="#131a33" stroke="#e8e6f5" stroke-width="3"/>
<path d="M1040 290v60h100v64" stroke="#e8e6f5" stroke-width="3" fill="none"/>
<!-- gen3 -->
<circle cx="500" cy="660" r="80" fill="#a78bfa" opacity=".35" filter="url(#glow)"/>
<circle cx="500" cy="660" r="36" fill="#1f1640" stroke="#c4b5fd" stroke-width="3"/><circle cx="500" cy="660" r="26" fill="none" stroke="#c4b5fd" stroke-width="3"/>
<rect x="684" y="624" width="72" height="72" rx="6" fill="#131a33" stroke="#e8e6f5" stroke-width="3"/>
<!-- inspector card -->
<rect x="1180" y="600" width="340" height="300" rx="28" fill="#ffffff" opacity=".07" stroke="#fff" stroke-opacity=".14"/>
<circle cx="1236" cy="660" r="22" fill="none" stroke="#c4b5fd" stroke-width="3"/>
<rect x="1276" y="646" width="150" height="12" rx="6" fill="#fff" opacity=".7"/><rect x="1276" y="668" width="96" height="10" rx="5" fill="#fff" opacity=".3"/>
<g opacity=".9"><path d="M1216 740h60" stroke="#5eead4" stroke-width="3"/><path d="M1216 748h60" stroke="#5eead4" stroke-width="3"/><rect x="1296" y="736" width="170" height="10" rx="5" fill="#fff" opacity=".35"/>
<path d="M1216 800l10 12 10-12 10 12 10-12 10 12" fill="none" stroke="#fb7185" stroke-width="3"/><rect x="1296" y="798" width="130" height="10" rx="5" fill="#fff" opacity=".35"/>
<path d="M1216 858h60" stroke="#e8e6f5" stroke-width="3"/><rect x="1296" y="852" width="150" height="10" rx="5" fill="#fff" opacity=".35"/></g>
</svg>
